name: Validate packages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: ./aurtomator.sh check-pins
        env:
          GITHUB_TOKEN: ${{ github.token }}

  validate:
    needs: pins
    uses: staticwire/aurtomator/.github/workflows/validate.yml@8999c2a98148a77ddfd2172e6fd1b9ed18e28df4 # v0.17.0
