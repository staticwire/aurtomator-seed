name: Validate packages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./aurtomator.sh check-pins

  validate:
    needs: pins
    uses: staticwire/aurtomator/.github/workflows/validate.yml@bfafc758f2d363c2fadd9fbe630f85e0d5d7d8b5 # v0.12.4
